<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#05070d;
    --line:rgba(120,160,255,.18);
    --txt:#eaf0ff;
    --dim:#8b96b5;
    --accent:#4f8cff;
    --accent2:#a855f7;
    --ok:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--txt);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;
    padding:24px;
    min-height:100vh;
    overflow:hidden;
    position:relative;
  }

  /* ==== BACKGROUND HERO ==== */
  .hero-bg{
    position:fixed;
    inset:0;
    background-image:url("https://static.wikia.nocookie.net/mobile-legends/images/6/6e/Hero_Background.png/revision/latest?cb=20210915000000");
    background-size:cover;
    background-position:center;
    opacity:.35;
    filter:blur(1px) saturate(1.2);
    z-index:0;
  }
  .hero-bg::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(900px 500px at 30% 20%, rgba(79,140,255,.25), transparent 60%),
      radial-gradient(800px 500px at 80% 80%, rgba(168,85,247,.22), transparent 60%),
      linear-gradient(180deg, rgba(5,7,13,.55), rgba(5,7,13,.92));
  }

  /* partikel / glow */
  .glow{
    position:fixed;
    width:520px;height:520px;
    border-radius:50%;
    filter:blur(120px);
    z-index:0;
    pointer-events:none;
  }
  .glow.a{background:rgba(79,140,255,.35);top:-160px;left:-120px}
  .glow.b{background:rgba(168,85,247,.28);bottom:-180px;right:-120px}

  /* ==== CARD ==== */
  .box{
    position:relative;
    z-index:2;
    width:100%;max-width:440px;
    background:linear-gradient(180deg, rgba(18,24,40,.85), rgba(10,14,24,.9));
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px 20px;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:
      0 30px 80px -30px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.06);
    display:flex;align-items:center;gap:10px;
  }
  .box::before{
    content:"";
    position:absolute;inset:-1px;
    border-radius:17px;
    padding:1px;
    background:linear-gradient(135deg, rgba(79,140,255,.6), rgba(168,85,247,.5), transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
    opacity:.7;
  }

  .box code{
    flex:1;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:14px;
    letter-spacing:.14em;
    color:#dbe6ff;
    word-break:break-all;
    user-select:all;
    text-shadow:0 0 18px rgba(79,140,255,.35);
    padding:6px 0;
  }

  button.copy{
    flex-shrink:0;
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:700;
    letter-spacing:.03em;
    color:#fff;
    background:linear-gradient(180deg,#4f8cff,#2563eb);
    border:1px solid rgba(120,160,255,.6);
    border-radius:9px;
    padding:10px 13px;
    cursor:pointer;
    transition:filter .15s, transform .05s, box-shadow .2s;
    white-space:nowrap;
    box-shadow:0 6px 20px -6px rgba(79,140,255,.7);
  }
  button.copy:hover{filter:brightness(1.12);box-shadow:0 8px 26px -6px rgba(79,140,255,.9)}
  button.copy:active{transform:translateY(1px)}
  button.copy.copied{
    background:linear-gradient(180deg,#22c55e,#16a34a);
    border-color:rgba(74,222,128,.6);
    box-shadow:0 6px 20px -6px rgba(34,197,94,.7);
  }

  @media (max-width:420px){
    .box{flex-direction:column;align-items:stretch}
    button.copy{justify-content:center}
    .box code{text-align:center}
  }
</style>
</head>
<body>

<div class="hero-bg"></div>
<div class="glow a"></div>
<div class="glow b"></div>

<div class="box">
  <code id="keyText">MEKINJIR-2026</code>
  <button class="copy" id="copyBtn">
    <i class="fa-regular fa-copy" id="copyIcon"></i>
    <span id="copyLabel">Copy</span>
  </button>
</div>

<script>
  const KEY_VALUE = "MEKINJIR-2026";

  const keyText   = document.getElementById('keyText');
  const copyBtn   = document.getElementById('copyBtn');
  const copyIcon  = document.getElementById('copyIcon');
  const copyLabel = document.getElementById('copyLabel');

  keyText.textContent = KEY_VALUE;

  async function copyKey(){
    try {
      await navigator.clipboard.writeText(KEY_VALUE);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = KEY_VALUE;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    copyBtn.classList.add('copied');
    copyIcon.className = 'fa-solid fa-check';
    copyLabel.textContent = 'Copied';

    setTimeout(() => {
      copyBtn.classList.remove('copied');
      copyIcon.className = 'fa-regular fa-copy';
      copyLabel.textContent = 'Copy';
    }, 1800);
  }

  copyBtn.addEventListener('click', copyKey);
</script>

</body>
</html>
